<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Cartoon Character Card</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: navy;
        }

        .card {
            background-color: lightyellow;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>My Cartoon Character Card</h1>

    <div class="card">
        <h2>SpongeBob SquarePants</h2>

        <!-- Inline CSS -->
        <p style="color: purple; font-weight: bold;">
            SpongeBob lives in a pineapple under the sea.
        </p>

        <p>His best friend is Patrick.</p>
    </div>
</body>
</html>
